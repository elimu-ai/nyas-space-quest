name: Gradle Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases must run one at a time, so that two of them never claim the same version
concurrency:
  group: gradle-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create_git_tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      tagName: ${{ steps.get_version_name.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The latest commit on the branch, which includes the version bump of any preceding release
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

      - name: Git Config
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Remove -SNAPSHOT from versionName
        working-directory: proj.android-studio
        run: ./gradlew :Nya2:removeSnapshot

      - name: Get the new versionName
        id: get_version_name
        working-directory: proj.android-studio
        run: |
          VERSION_NAME="$(./gradlew :Nya2:getVersionName --quiet --console=plain)"
          echo "VERSION_NAME $VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit and tag the release
        env:
          VERSION_NAME: ${{ steps.get_version_name.outputs.version_name }}
        run: |
          git add proj.android-studio/app/build.gradle
          git commit -m "chore: prepare release $VERSION_NAME"
          git tag "$VERSION_NAME"

      - name: Bump version and add -SNAPSHOT to versionName
        working-directory: proj.android-studio
        run: |
          ./gradlew :Nya2:bumpVersion
          ./gradlew :Nya2:addSnapshot

      - name: Commit the next development iteration
        run: |
          git add proj.android-studio/app/build.gradle
          git commit -m "chore: prepare for next development iteration"

      - name: Push commits and tag
        env:
          VERSION_NAME: ${{ steps.get_version_name.outputs.version_name }}
        # Atomic, so that a rejected push doesn't leave behind a tag which blocks the next release
        run: git push --atomic origin HEAD:main "refs/tags/$VERSION_NAME"

  release_apk:
    needs: create_git_tag
    runs-on: ubuntu-22.04
    env:
      VERSION_NAME: ${{ needs.create_git_tag.outputs.tagName }}
    outputs:
      applicationId: ${{ steps.rename_apk.outputs.application_id }}
      apkFileUrl: ${{ steps.prepare_apk_file_url.outputs.apk_file_url }}
    steps:
      - name: Checkout refs/tags/${{ needs.create_git_tag.outputs.tagName }}
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.create_git_tag.outputs.tagName }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

      - name: Assemble `release` build
        working-directory: proj.android-studio
        run: ./gradlew :Nya2:assembleRelease

      - name: Sign the APK file
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: proj.android-studio/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGN_ANDROID_KEY }}
          alias: ${{ secrets.SIGN_ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.SIGN_ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGN_ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename the signed APK file
        id: rename_apk
        env:
          SIGNED_RELEASE_FILE: ${{ steps.sign_app.outputs.signedReleaseFile }}
        run: |
          APPLICATION_ID="$(sed -n 's/^ *applicationId "\(.*\)"/\1/p' proj.android-studio/app/build.gradle)"
          APK_FILE="proj.android-studio/app/build/outputs/apk/release/$APPLICATION_ID-$VERSION_NAME.apk"
          mv "$SIGNED_RELEASE_FILE" "$APK_FILE"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "application_id=$APPLICATION_ID" >> "$GITHUB_OUTPUT"

      - name: Upload the signed APK file to GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.create_git_tag.outputs.tagName }}
          files: ${{ steps.rename_apk.outputs.apk_file }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Prepare the APK file URL
        id: prepare_apk_file_url
        env:
          APPLICATION_ID: ${{ steps.rename_apk.outputs.application_id }}
        run: |
          APK_FILE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION_NAME/$APPLICATION_ID-$VERSION_NAME.apk"
          echo "APK_FILE_URL $APK_FILE_URL"
          echo "apk_file_url=$APK_FILE_URL" >> "$GITHUB_OUTPUT"

  notify_webapp_api:
    needs: [create_git_tag, release_apk]
    strategy:
      max-parallel: 1
      matrix:
        language_code: [eng, hin, tgl, tha, vie]
    runs-on: ubuntu-22.04
    steps:
      - name: Send HTTP request to `${{ matrix.language_code }}.elimu.ai`
        uses: fjogeleit/http-request-action@v2
        with:
          url: http://${{ matrix.language_code }}.elimu.ai/rest/v2/applications/${{ needs.release_apk.outputs.applicationId }}/application-versions/${{ needs.create_git_tag.outputs.tagName }}
          method: PUT
          data: '{"fileUrl": "${{ needs.release_apk.outputs.apkFileUrl }}"}'
          customHeaders: '{"Content-Type": "application/json"}'
          timeout: 60000
